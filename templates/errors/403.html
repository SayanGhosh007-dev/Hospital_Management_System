{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div style="text-align: center; padding: 50px 20px;">
    <h1 style="font-size: 5rem; color: var(--danger-color);">403</h1>
    <h2 style="margin-bottom: 20px;">Permission Denied</h2>
    <p style="color: var(--text-secondary); max-width: 500px; margin: 0 auto 30px;">
        You do not have the required role clearances or permissions to view this resource. 
        Manually rewriting URLs is restricted.
    </p>
    <a href="{% url 'dashboard_redirect' %}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
