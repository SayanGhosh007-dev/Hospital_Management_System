{% extends "base.html" %}
{% block title %}Emergency Broadcast{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 30px; background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--border-radius); box-shadow: 0 4px 6px var(--shadow-color);">
    <h3 style="color: var(--danger-color);">🚨 Code Blue - Trigger Hospital Emergency Protocol</h3>
    <p style="color: var(--text-secondary); margin-bottom: 20px;">Dispatches system alert triggers to available on-call specialist doctors.</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Required Medical Specialization</label>
            <input type="text" name="specialization" class="form-control" placeholder="e.g. Cardiology, Neurology, General" required>
        </div>

        <div class="form-group">
            <label>Emergency details</label>
            <textarea name="details" class="form-control" rows="4" placeholder="Describe clinical symptoms or location..." required></textarea>
        </div>

        <div style="margin-top: 30px; display: flex; gap: 15px; justify-content: flex-end;">
            <a href="{% url 'dashboard_redirect' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" style="background-color: var(--danger-color);">Trigger Broadcast</button>
        </div>
    </form>
</div>

<style>
    form input, form textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        background-color: var(--surface-color);
        color: var(--text-primary);
        font-size: 1rem;
        margin-top: 5px;
    }
</style>
{% endblock %}
