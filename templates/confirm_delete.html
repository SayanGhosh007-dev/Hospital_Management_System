{% extends "base.html" %}
{% block title %}Confirm Deletion{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 60px auto; padding: 30px; background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--border-radius); box-shadow: 0 4px 6px var(--shadow-color); text-align: center;">
    <div style="font-size: 3rem; color: var(--danger-color); margin-bottom: 15px;">⚠️</div>
    <h3>Are you sure you want to delete this {{ object_name }}?</h3>
    <p style="color: var(--text-secondary); margin-bottom: 25px;">This action is permanent and cannot be undone.</p>
    
    <form method="POST">
        {% csrf_token %}
        <div style="display: flex; justify-content: center; gap: 15px;">
            <a href="{{ cancel_url }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" style="background-color: var(--danger-color);">Confirm Delete</button>
        </div>
    </form>
</div>
{% endblock %}
